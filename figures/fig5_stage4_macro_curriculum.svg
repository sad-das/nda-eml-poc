<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Figure 5. Stage 4 macro-node curriculum</title>
  <desc id="desc">Historical raw EML expansion cost and macro-depth for committed Stage 4 discoveries.</desc>
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #1f2933; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 17px; fill: #52616b; }
      .axis { stroke: #1f2933; stroke-width: 2; }
      .grid { stroke: #d7dee5; stroke-width: 1; }
      .bar { fill: #2f6f9f; }
      .bar-hi { fill: #c95c54; }
      .dot { fill: #ffffff; stroke: #d98324; stroke-width: 4; }
      .line { stroke: #d98324; stroke-width: 2.4; fill: none; }
      .tick { font-size: 14px; fill: #52616b; }
      .value { font-size: 14px; font-weight: 700; fill: #1f2933; }
      .value-hi { font-size: 14px; font-weight: 700; fill: #ffffff; }
      .small { font-size: 14px; fill: #3e4c59; }
      .label { font-size: 16px; }
      .legend-box { stroke: #243b53; stroke-width: 1.2; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="760" fill="#ffffff"/>
  <text x="52" y="58" class="title">Figure 5. Stage 4 macro-node curriculum</text>
  <text x="52" y="86" class="subtitle">Macro proposals stay shallow while preserving raw EML expansion provenance.</text>

  <g transform="translate(115 145)">
    <line class="grid" x1="0" y1="430" x2="950" y2="430"/>
    <line class="grid" x1="0" y1="358" x2="950" y2="358"/>
    <line class="grid" x1="0" y1="287" x2="950" y2="287"/>
    <line class="grid" x1="0" y1="215" x2="950" y2="215"/>
    <line class="grid" x1="0" y1="143" x2="950" y2="143"/>
    <line class="grid" x1="0" y1="72" x2="950" y2="72"/>
    <line class="grid" x1="0" y1="0" x2="950" y2="0"/>
    <line class="axis" x1="0" y1="430" x2="950" y2="430"/>
    <line class="axis" x1="0" y1="430" x2="0" y2="0"/>
    <line class="axis" x1="950" y1="430" x2="950" y2="0"/>

    <text class="tick" x="-18" y="435" text-anchor="end">0</text>
    <text class="tick" x="-18" y="363" text-anchor="end">10</text>
    <text class="tick" x="-18" y="292" text-anchor="end">20</text>
    <text class="tick" x="-18" y="220" text-anchor="end">30</text>
    <text class="tick" x="-18" y="148" text-anchor="end">40</text>
    <text class="tick" x="-18" y="77" text-anchor="end">50</text>
    <text class="tick" x="-18" y="5" text-anchor="end">60</text>
    <text class="label" x="-72" y="218" text-anchor="middle" transform="rotate(-90 -72,218)">historical raw EML nodes</text>

    <text class="tick" x="970" y="435">0</text>
    <text class="tick" x="970" y="327">1</text>
    <text class="tick" x="970" y="220">2</text>
    <text class="tick" x="970" y="112">3</text>
    <text class="tick" x="970" y="5">4</text>
    <text class="label" x="1032" y="218" text-anchor="middle" transform="rotate(90 1032,218)">macro-depth</text>

    <rect class="bar" x="32" y="408.5" width="48" height="21.5"/><text class="value" x="56" y="398" text-anchor="middle">3</text>
    <rect class="bar" x="125" y="379.8" width="48" height="50.2"/><text class="value" x="149" y="369" text-anchor="middle">7</text>
    <rect class="bar" x="218" y="408.5" width="48" height="21.5"/><text class="value" x="242" y="398" text-anchor="middle">3</text>
    <rect class="bar" x="311" y="379.8" width="48" height="50.2"/><text class="value" x="335" y="369" text-anchor="middle">7</text>
    <rect class="bar" x="404" y="351.2" width="48" height="78.8"/><text class="value" x="428" y="340" text-anchor="middle">11</text>
    <rect class="bar" x="497" y="308.2" width="48" height="121.8"/><text class="value" x="521" y="297" text-anchor="middle">17</text>
    <rect class="bar" x="590" y="121.8" width="48" height="308.2"/><text class="value" x="614" y="110" text-anchor="middle">43</text>
    <rect class="bar-hi" x="683" y="21.5" width="48" height="408.5"/><text class="value-hi" x="707" y="50" text-anchor="middle">57</text>
    <rect class="bar" x="776" y="250.8" width="48" height="179.2"/><text class="value" x="800" y="239" text-anchor="middle">25</text>
    <rect class="bar-hi" x="869" y="21.5" width="48" height="408.5"/><text class="value-hi" x="893" y="50" text-anchor="middle">57</text>

    <polyline class="line" points="56,322.5 149,107.5 242,322.5 335,322.5 428,215 521,322.5 614,215 707,107.5 800,107.5 893,322.5"/>
    <circle class="dot" cx="56" cy="322.5" r="7"/><circle class="dot" cx="149" cy="107.5" r="7"/><circle class="dot" cx="242" cy="322.5" r="7"/><circle class="dot" cx="335" cy="322.5" r="7"/><circle class="dot" cx="428" cy="215" r="7"/>
    <circle class="dot" cx="521" cy="322.5" r="7"/><circle class="dot" cx="614" cy="215" r="7"/><circle class="dot" cx="707" cy="107.5" r="7"/><circle class="dot" cx="800" cy="107.5" r="7"/><circle class="dot" cx="893" cy="322.5" r="7"/>

    <text class="small" x="56" y="462" text-anchor="middle">exp</text>
    <text class="small" x="149" y="462" text-anchor="middle">ln</text>
    <text class="small" x="242" y="462" text-anchor="middle">e</text>
    <text class="small" x="335" y="462" text-anchor="middle">zero</text>
    <text class="small" x="428" y="462" text-anchor="middle">sub</text>
    <text class="small" x="521" y="462" text-anchor="middle">neg</text>
    <text class="small" x="614" y="462" text-anchor="middle">add</text>
    <text class="small" x="707" y="462" text-anchor="middle">mul</text>
    <text class="small" x="800" y="462" text-anchor="middle">div</text>
    <text class="small" x="893" y="462" text-anchor="middle">square</text>

    <g transform="translate(330 505)">
      <rect class="legend-box bar" x="0" y="0" width="18" height="18"/><text class="small" x="28" y="15">raw expansion cost</text>
      <line class="line" x1="205" y1="9" x2="245" y2="9"/><circle class="dot" cx="225" cy="9" r="6"/><text class="small" x="260" y="15">macro-depth</text>
    </g>
  </g>

  <text class="small" x="115" y="710">Multiplication is discovered as exp(add(ln(x),ln(y))): 57 raw EML nodes in provenance, but macro-depth 3 at proposal time.</text>
</svg>
