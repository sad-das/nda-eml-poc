<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Figure 1. NDA core loop</title>
  <desc id="desc">Contradiction-preserving loop from Belnap state through freeze, synthesis, verification, practice testing and DKG commit.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L11,6 L1,11 Z" fill="#2b2b2b"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #1f2933; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 17px; fill: #52616b; }
      .label { font-size: 21px; font-weight: 700; }
      .small { font-size: 16px; fill: #3e4c59; }
      .tiny { font-size: 13px; fill: #52616b; }
      .box { stroke: #243b53; stroke-width: 2; rx: 10; }
      .blue { fill: #e6f0fa; }
      .amber { fill: #fff3d6; }
      .green { fill: #e6f4ea; }
      .red { fill: #fdebea; }
      .gray { fill: #f4f6f8; }
      .arrow { stroke: #2b2b2b; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .soft { stroke: #607d8b; stroke-width: 2; fill: none; stroke-dasharray: 6 5; marker-end: url(#arrow); }
      .state { fill: #ffffff; stroke: #607d8b; stroke-width: 1.4; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="760" fill="#ffffff"/>
  <text x="52" y="58" class="title">Figure 1. NDA core loop</text>
  <text x="52" y="86" class="subtitle">Contradiction is preserved as a control signal, then converted into verified structural growth.</text>

  <rect class="box blue" x="72" y="160" width="220" height="96" rx="10"/>
  <text class="label" x="182" y="198" text-anchor="middle">Belnap state</text>
  <text class="small" x="182" y="225" text-anchor="middle">T / F / B / N</text>

  <rect class="box amber" x="370" y="160" width="220" height="96" rx="10"/>
  <text class="label" x="480" y="198" text-anchor="middle">Gradient Freeze</text>
  <text class="small" x="480" y="225" text-anchor="middle">protect witnesses</text>

  <rect class="box blue" x="668" y="160" width="220" height="96" rx="10"/>
  <text class="label" x="778" y="198" text-anchor="middle">Synthesis</text>
  <text class="small" x="778" y="225" text-anchor="middle">candidate mediation</text>

  <rect class="box green" x="668" y="340" width="220" height="96" rx="10"/>
  <text class="label" x="778" y="378" text-anchor="middle">Gate 6</text>
  <text class="small" x="778" y="405" text-anchor="middle">structural verification</text>

  <rect class="box green" x="370" y="340" width="220" height="96" rx="10"/>
  <text class="label" x="480" y="378" text-anchor="middle">Practice test</text>
  <text class="small" x="480" y="405" text-anchor="middle">stress domains</text>

  <rect class="box gray" x="72" y="340" width="220" height="96" rx="10"/>
  <text class="label" x="182" y="378" text-anchor="middle">DKG commit</text>
  <text class="small" x="182" y="405" text-anchor="middle">macro-node record</text>

  <path class="arrow" d="M292,208 H370"/>
  <path class="arrow" d="M590,208 H668"/>
  <path class="arrow" d="M778,256 V340"/>
  <path class="arrow" d="M668,388 H590"/>
  <path class="arrow" d="M370,388 H292"/>
  <path class="arrow" d="M182,340 V256"/>

  <rect class="box red" x="930" y="185" width="200" height="90" rx="10"/>
  <text class="label" x="1030" y="214" text-anchor="middle">Negative</text>
  <text class="label" x="1030" y="244" text-anchor="middle">topology</text>
  <text class="tiny" x="1030" y="267" text-anchor="middle">fatal rejections</text>

  <rect class="box gray" x="930" y="360" width="200" height="90" rx="10"/>
  <text class="label" x="1030" y="395" text-anchor="middle">RLCR</text>
  <text class="small" x="1030" y="422" text-anchor="middle">proposal ordering</text>

  <path class="soft" d="M888,388 C925,388 930,405 930,405"/>
  <path class="soft" d="M930,230 C910,230 895,260 875,325"/>
  <path class="soft" d="M1030,360 C1030,320 995,292 970,276"/>

  <g transform="translate(82 520)">
    <text class="label" x="0" y="0">Operational interpretation</text>
    <circle class="state" cx="8" cy="34" r="7"/><text class="small" x="24" y="40">B-state contradiction triggers freeze and mediation, not smoothing.</text>
    <circle class="state" cx="8" cy="66" r="7"/><text class="small" x="24" y="72">Gate 6 accepts only stress-stable structures.</text>
    <circle class="state" cx="8" cy="98" r="7"/><text class="small" x="24" y="104">Rejected shortcuts become negative topology, not reward shaping.</text>
  </g>
</svg>
