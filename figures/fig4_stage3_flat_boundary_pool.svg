<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Figure 4. Stage 3 flat-search boundary</title>
  <desc id="desc">Candidate pool and scanned candidate counts for raw EML flat search at max depth 3.</desc>
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #1f2933; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 17px; fill: #52616b; }
      .axis { stroke: #1f2933; stroke-width: 2; }
      .grid { stroke: #d7dee5; stroke-width: 1; }
      .pool { fill: #9fbad1; }
      .scanned { fill: #2f6f9f; }
      .found { fill: #59a14f; }
      .notfound { fill: #c95c54; }
      .label { font-size: 16px; }
      .small { font-size: 14px; fill: #3e4c59; }
      .tick { font-size: 14px; fill: #52616b; }
      .legend-box { stroke: #243b53; stroke-width: 1.2; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="760" fill="#ffffff"/>
  <text x="52" y="58" class="title">Figure 4. Stage 3 flat-search boundary</text>
  <text x="52" y="86" class="subtitle">Flat raw search reaches shallow logarithmic witnesses but exhausts the pool for deeper arithmetic targets.</text>

  <g transform="translate(120 145)">
    <line class="grid" x1="0" y1="430" x2="930" y2="430"/>
    <line class="grid" x1="0" y1="322" x2="930" y2="322"/>
    <line class="grid" x1="0" y1="214" x2="930" y2="214"/>
    <line class="grid" x1="0" y1="106" x2="930" y2="106"/>
    <line class="grid" x1="0" y1="0" x2="930" y2="0"/>
    <line class="axis" x1="0" y1="430" x2="930" y2="430"/>
    <line class="axis" x1="0" y1="430" x2="0" y2="0"/>
    <text class="tick" x="-18" y="435" text-anchor="end">10</text>
    <text class="tick" x="-18" y="327" text-anchor="end">100</text>
    <text class="tick" x="-18" y="219" text-anchor="end">1k</text>
    <text class="tick" x="-18" y="111" text-anchor="end">10k</text>
    <text class="tick" x="-18" y="5" text-anchor="end">30k</text>
    <text class="label" x="-78" y="218" text-anchor="middle" transform="rotate(-90 -78,218)">candidates, log scale</text>

    <g transform="translate(50 0)">
      <rect class="pool" x="0" y="176" width="54" height="254"/>
      <rect class="scanned" x="62" y="396" width="54" height="34"/>
      <circle class="found" cx="58" cy="145" r="9"/>
      <text class="small" x="58" y="462" text-anchor="middle">ln_x</text>
      <text class="tick" x="58" y="130" text-anchor="middle">found</text>
    </g>
    <g transform="translate(225 0)">
      <rect class="pool" x="0" y="18" width="54" height="412"/>
      <rect class="scanned" x="62" y="18" width="54" height="412"/>
      <circle class="notfound" cx="58" cy="145" r="9"/>
      <text class="small" x="58" y="458" text-anchor="middle">
        <tspan x="58" dy="0">x_plus</tspan>
        <tspan x="58" dy="20">y</tspan>
      </text>
    </g>
    <g transform="translate(400 0)">
      <rect class="pool" x="0" y="18" width="54" height="412"/>
      <rect class="scanned" x="62" y="18" width="54" height="412"/>
      <circle class="notfound" cx="58" cy="145" r="9"/>
      <text class="small" x="58" y="458" text-anchor="middle">
        <tspan x="58" dy="0">x_times</tspan>
        <tspan x="58" dy="20">y</tspan>
      </text>
    </g>
    <g transform="translate(575 0)">
      <rect class="pool" x="0" y="18" width="54" height="412"/>
      <rect class="scanned" x="62" y="18" width="54" height="412"/>
      <circle class="notfound" cx="58" cy="145" r="9"/>
      <text class="small" x="58" y="458" text-anchor="middle">
        <tspan x="58" dy="0">x_div</tspan>
        <tspan x="58" dy="20">y</tspan>
      </text>
    </g>
    <g transform="translate(750 0)">
      <rect class="pool" x="0" y="176" width="54" height="254"/>
      <rect class="scanned" x="62" y="176" width="54" height="254"/>
      <circle class="notfound" cx="58" cy="145" r="9"/>
      <text class="small" x="58" y="462" text-anchor="middle">square</text>
    </g>

    <g transform="translate(350 505)">
      <rect class="legend-box pool" x="0" y="0" width="18" height="18"/><text class="small" x="28" y="15">generated pool</text>
      <rect class="legend-box scanned" x="160" y="0" width="18" height="18"/><text class="small" x="188" y="15">scanned</text>
      <circle class="found" cx="326" cy="9" r="8"/><text class="small" x="342" y="15">found</text>
      <circle class="notfound" cx="420" cy="9" r="8"/><text class="small" x="436" y="15">not found</text>
    </g>
  </g>

  <text class="small" x="120" y="710">Raw EML max depth = 3. Multiplication and division require macro-node curriculum rather than flat raw enumeration.</text>
</svg>
