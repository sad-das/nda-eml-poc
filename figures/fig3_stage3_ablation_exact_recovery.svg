<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Figure 3. Stage 3 ablation outcomes</title>
  <desc id="desc">Grouped bar chart comparing exact recovery and final preservation rates across six Stage 3 variants.</desc>
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #1f2933; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 17px; fill: #52616b; }
      .axis { stroke: #1f2933; stroke-width: 2; }
      .grid { stroke: #d7dee5; stroke-width: 1; }
      .tick { font-size: 14px; fill: #52616b; }
      .label { font-size: 16px; fill: #1f2933; }
      .small { font-size: 14px; fill: #3e4c59; }
      .exact { fill: #2f6f9f; }
      .preserve { fill: #59a14f; }
      .fail { fill: #c95c54; }
      .legend-box { stroke: #243b53; stroke-width: 1.2; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="760" fill="#ffffff"/>
  <text x="52" y="58" class="title">Figure 3. Stage 3 ablation outcomes</text>
  <text x="52" y="86" class="subtitle">Exact recovery requires structural verification; preservation collapses when freeze is removed.</text>

  <g transform="translate(110 150)">
    <line class="grid" x1="0" y1="420" x2="960" y2="420"/>
    <line class="grid" x1="0" y1="336" x2="960" y2="336"/>
    <line class="grid" x1="0" y1="252" x2="960" y2="252"/>
    <line class="grid" x1="0" y1="168" x2="960" y2="168"/>
    <line class="grid" x1="0" y1="84" x2="960" y2="84"/>
    <line class="grid" x1="0" y1="0" x2="960" y2="0"/>
    <line class="axis" x1="0" y1="420" x2="960" y2="420"/>
    <line class="axis" x1="0" y1="420" x2="0" y2="0"/>

    <text class="tick" x="-18" y="425" text-anchor="end">0.0</text>
    <text class="tick" x="-18" y="341" text-anchor="end">0.2</text>
    <text class="tick" x="-18" y="257" text-anchor="end">0.4</text>
    <text class="tick" x="-18" y="173" text-anchor="end">0.6</text>
    <text class="tick" x="-18" y="89" text-anchor="end">0.8</text>
    <text class="tick" x="-18" y="5" text-anchor="end">1.0</text>
    <text class="label" x="-72" y="212" text-anchor="middle" transform="rotate(-90 -72,212)">rate</text>

    <g transform="translate(38 0)">
      <rect class="exact" x="0" y="420" width="42" height="0"/>
      <rect class="preserve" x="48" y="0" width="42" height="420"/>
      <text class="small" x="45" y="452" text-anchor="middle">gradient</text>
      <text class="small" x="45" y="471" text-anchor="middle">only</text>
    </g>
    <g transform="translate(198 0)">
      <rect class="exact" x="0" y="0" width="42" height="420"/>
      <rect class="preserve" x="48" y="0" width="42" height="420"/>
      <text class="small" x="45" y="452" text-anchor="middle">NDA</text>
      <text class="small" x="45" y="471" text-anchor="middle">full</text>
    </g>
    <g transform="translate(358 0)">
      <rect class="exact" x="0" y="0" width="42" height="420"/>
      <rect class="preserve" x="48" y="226.2" width="42" height="193.8"/>
      <text class="small" x="45" y="452" text-anchor="middle">no</text>
      <text class="small" x="45" y="471" text-anchor="middle">freeze</text>
    </g>
    <g transform="translate(518 0)">
      <rect class="exact fail" x="0" y="420" width="42" height="0"/>
      <rect class="preserve" x="48" y="323.1" width="42" height="96.9"/>
      <text class="small" x="45" y="452" text-anchor="middle">no</text>
      <text class="small" x="45" y="471" text-anchor="middle">Gate 6</text>
    </g>
    <g transform="translate(678 0)">
      <rect class="exact" x="0" y="0" width="42" height="420"/>
      <rect class="preserve" x="48" y="0" width="42" height="420"/>
      <text class="small" x="45" y="452" text-anchor="middle">no</text>
      <text class="small" x="45" y="471" text-anchor="middle">RLCR</text>
    </g>
    <g transform="translate(838 0)">
      <rect class="exact fail" x="0" y="420" width="42" height="0"/>
      <rect class="preserve" x="48" y="0" width="42" height="420"/>
      <text class="small" x="45" y="452" text-anchor="middle">random</text>
      <text class="small" x="45" y="471" text-anchor="middle">tree</text>
    </g>

    <g transform="translate(330 510)">
      <rect class="legend-box exact" x="0" y="0" width="18" height="18"/>
      <text class="small" x="28" y="15">exact recovery</text>
      <rect class="legend-box preserve" x="170" y="0" width="18" height="18"/>
      <text class="small" x="198" y="15">final preservation</text>
    </g>
  </g>

  <text class="small" x="110" y="710">Values are averaged over 3 seeds and 39 targets. Preservation means retention of existing frozen witnesses, not new discovery.</text>
</svg>
